version: '3.8'

services:
  db:
    image: postgres:16-alpine[cite: 4]
    container_name: ${COMPOSE_PROJECT_NAME}_db
    restart: always[cite: 4]
    environment:
      POSTGRES_DB: ${DB_NAME}[cite: 4]
      POSTGRES_USER: ${DB_USER}[cite: 4]
      POSTGRES_PASSWORD: ${DB_PASSWORD}[cite: 4]
    volumes:
      - postgres_data:/var/lib/postgresql/data[cite: 4]
    command: >
      postgres -c shared_buffers=${PG_SHARED_BUFFERS}
               -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}
               -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM}
               -c work_mem=${PG_WORK_MEM}
    networks:
      - parish_net

  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME}_app
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENV}
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - parish_net

  nginx:
    image: nginx:alpine
    container_name: ${COMPOSE_PROJECT_NAME}_nginx
    restart: always
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - parish_net

volumes:
  postgres_data:[cite: 4]

networks:
  parish_net:
    driver: bridge