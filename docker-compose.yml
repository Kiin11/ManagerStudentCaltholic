services:
  db:
    image: postgres:16-alpine
    container_name: parish_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: >
      postgres -c shared_buffers=${PG_SHARED_BUFFERS}
               -c effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}
               -c maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM}
               -c work_mem=${PG_WORK_MEM}
    networks:
      - parish_net

  app:
    build:
      context: ./ManagerStudentCaltholic
      dockerfile: Dockerfile
    container_name: parish_app
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENV}
      - ASPNETCORE_URLS=http://+:5000
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD}
    depends_on:
      - db
    networks:
      - parish_net

  nginx:
    image: nginx:alpine
    container_name: parish_nginx
    restart: always
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - parish_net

volumes:
  postgres_data:

networks:
  parish_net:
    driver: bridge
