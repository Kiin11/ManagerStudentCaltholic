services:
  dotnet_app:
    build:
      context: ./app-source
      dockerfile: Dockerfile
    container_name: dotnet_backend
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # Chuỗi kết nối trực tiếp đến Azure Database for PostgreSQL Flexible Server
      - ConnectionStrings__DefaultConnection=Host=<TEN_SERVER_AZURE>.postgres.database.azure.com;Port=5432;Database=postgres;Username=<ADMIN_LOGIN>;Password=<MAT_KHAU>;SSL Mode=Require;Trust Server Certificate=true;
    expose:
      - "8080"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dotnet_app
    networks:
      - app_network

networks:
  app_network:
    driver: bridge