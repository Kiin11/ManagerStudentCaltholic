services:
  dotnet_app:
    build:
      context: ./ManagerStudentCaltholic
      dockerfile: Dockerfile
    container_name: parish_app
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      # Chuỗi kết nối trực tiếp đến Azure Database for PostgreSQL Flexible Server
      - ConnectionStrings__DefaultConnection=Host=${DB_HOST};Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};SSL Mode=Require;Trust Server Certificate=true;
    expose:
      - "8080"
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    container_name: parish_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - dotnet_app
    networks:
      - app_network

networks:
  app_network:
    driver: bridge