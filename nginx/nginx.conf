# ==============================================================================
# ĐỊNH NGHĨA CÁC ZONE GIỚI HẠN TẦN SUẤT (RATE LIMITING ZONES)
# ==============================================================================
# 1. Giới hạn chung theo IP cho toàn bộ ứng dụng: 20 req/s, bộ nhớ cache 10MB (~160.000 IP)
limit_req_zone $binary_remote_addr zone=global_req_limit:10m rate=20r/s;

# 2. Giới hạn nghiêm ngặt cho Endpoint Xác thực / Đăng nhập / Tra cứu công khai: 5 req/s trên 1 IP
limit_req_zone $binary_remote_addr zone=login_req_limit:10m rate=5r/s;

# 3. Giới hạn số lượng kết nối đồng thời từ 1 IP: tối đa 15 kết nối
limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

server {
    listen 80;
    server_name _;

    # SEC-11 FIX: Ẩn số phiên bản của Nginx trên Header phản hồi và trang lỗi
    server_tokens off;

    # TASK-706: Giới hạn dung lượng tải lên tối đa (20MB) để tránh đẩy file quá lớn làm tràn RAM
    client_max_body_size 20M;

    # TASK-706: Cấu hình Timeout chống tấn công giữ kết nối (Slowloris attack)
    client_body_timeout 15s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 15s;

    # Mã HTTP trả về khi vượt ngưỡng Rate Limit / Connection Limit
    limit_req_status 429;
    limit_conn_status 429;

    # SEC-11 FIX: Chặn tuyệt đối truy cập mọi tệp và thư mục cấu hình ẩn (.env, .git, .htaccess...)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 1. Bảo vệ trang Đăng nhập, Làm mới Token, Tra cứu công khai, Nộp đơn xin nghỉ & Đăng ký trực tuyến
	location ~* ^/(Account/Login|Account/RefreshToken|api/auth/login|TraCuu/Search|Absence/SubmitRequest|PublicRegistration/Submit) {
		limit_req zone=login_req_limit burst=5 nodelay;
		limit_conn addr_conn_limit 5;

		proxy_pass http://app:5000;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection keep-alive;
		proxy_set_header Host $host;
		proxy_cache_bypass $http_upgrade;
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Real-IP $remote_addr;
	}

    # 2. Toàn bộ các trang và request còn lại của ứng dụng
    location / {
        limit_req zone=global_req_limit burst=15 nodelay;
        limit_conn addr_conn_limit 15;

        proxy_pass http://app:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}