name: Build and Push Docker Image to GHCR

on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'Release phase (e.g. inf, 5, 6)'
        required: true
        default: 'inf'
        type: string
      hotfix:
        description: 'Optional hotfix suffix (e.g. hf1). Leave blank for normal release.'
        required: false
        default: ''
        type: string
      number:
        description: 'Build sequence number (e.g. 1, 2)'
        required: true
        default: '1'
        type: string
      year:
        description: 'Optional 2-digit year (e.g. 26). Leave blank for current Asia/Ho_Chi_Minh year.'
        required: false
        default: ''
        type: string
      image_name:
        description: 'Container image name (default: parish-app)'
        required: false
        default: 'parish-app'
        type: string
      push:
        description: 'Push image to GHCR (uncheck for build & size check only)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build linux/amd64 Image & Push to GHCR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate inputs and compute standardized OCI tag
        id: meta
        env:
          INPUT_PHASE: ${{ inputs.phase }}
          INPUT_HOTFIX: ${{ inputs.hotfix }}
          INPUT_NUMBER: ${{ inputs.number }}
          INPUT_YEAR: ${{ inputs.year }}
          INPUT_NAME: ${{ inputs.image_name }}
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          NAME="$(printf '%s' "${INPUT_NAME:-parish-app}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          OWNER="$(printf '%s' "${REPO_OWNER}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          PHASE="$(printf '%s' "${INPUT_PHASE}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          HOTFIX="$(printf '%s' "${INPUT_HOTFIX:-}" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')"
          NUMBER="$(printf '%s' "${INPUT_NUMBER}" | tr -d '[:space:]')"
          YEAR="$(printf '%s' "${INPUT_YEAR:-}" | tr -d '[:space:]')"

          if [[ -z "$YEAR" ]]; then
            YEAR="$(TZ=Asia/Ho_Chi_Minh date +%y)"
          fi

          if [[ ! "$NAME" =~ ^[a-z0-9][a-z0-9-]*$ ]]; then
            echo "::error::Invalid image_name '${NAME}'. Expected lowercase alphanumeric and hyphens."
            exit 1
          fi
          if [[ ! "$YEAR" =~ ^[0-9]{2}$ ]]; then
            echo "::error::Invalid year '${YEAR}'. Expected 2 digits (e.g. 26)."
            exit 1
          fi
          if [[ ! "$PHASE" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Invalid phase '${PHASE}'. Expected lowercase alphanumeric token (e.g. inf, 5, 6)."
            exit 1
          fi
          if [[ -n "$HOTFIX" && ! "$HOTFIX" =~ ^[a-z0-9]+$ ]]; then
            echo "::error::Invalid hotfix '${HOTFIX}'. Expected lowercase alphanumeric token (e.g. hf1)."
            exit 1
          fi
          if [[ ! "$NUMBER" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid number '${NUMBER}'. Expected positive integer >= 1."
            exit 1
          fi

          if [[ -z "$HOTFIX" ]]; then
            IMAGE_TAG="${NAME}-v1.${YEAR}.${PHASE}.${NUMBER}"
          else
            IMAGE_TAG="${NAME}-v1.${YEAR}.${PHASE}-${HOTFIX}.${NUMBER}"
          fi

          IMAGE_REF="${REGISTRY}/${OWNER}/${NAME}:${IMAGE_TAG}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(TZ=Asia/Ho_Chi_Minh date +%Y-%m-%d)"

          {
            echo "owner=${OWNER}"
            echo "image_name=${NAME}"
            echo "image_tag=${IMAGE_TAG}"
            echo "image_ref=${IMAGE_REF}"
            echo "short_sha=${SHORT_SHA}"
            echo "build_date=${BUILD_DATE}"
          } >> "$GITHUB_OUTPUT"

          echo "Computed Image Tag : ${IMAGE_TAG}"
          echo "Computed Image Ref : ${IMAGE_REF}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: ${{ inputs.push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build linux/amd64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./ManagerStudentCaltholic/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image_ref }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.title=${{ steps.meta.outputs.image_name }}
            org.opencontainers.image.version=${{ steps.meta.outputs.image_tag }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Check image size (< 250 MB target)
        id: size
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          set -euo pipefail
          SIZE_BYTES="$(docker image inspect --format '{{.Size}}' "$IMAGE_REF")"
          SIZE_MB="$(awk -v b="$SIZE_BYTES" 'BEGIN { printf "%.2f", b / 1048576 }')"
          IS_OVERSIZE="$(awk -v mb="$SIZE_MB" 'BEGIN { print (mb >= 250.0) ? "1" : "0" }')"

          echo "size_mb=${SIZE_MB}" >> "$GITHUB_OUTPUT"
          echo "is_oversize=${IS_OVERSIZE}" >> "$GITHUB_OUTPUT"

          if [[ "$IS_OVERSIZE" == "1" ]]; then
            echo "::warning::Built image size is ${SIZE_MB} MB (>= 250 MB target threshold)."
          else
            echo "Image size OK: ${SIZE_MB} MB (< 250 MB target)."
          fi

      - name: Push image to GHCR
        if: ${{ inputs.push }}
        env:
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
        run: |
          set -euo pipefail
          docker push "$IMAGE_REF"

      - name: Publish build & deploy summary
        env:
          BUILD_DATE: ${{ steps.meta.outputs.build_date }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          IMAGE_REF: ${{ steps.meta.outputs.image_ref }}
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
          SIZE_MB: ${{ steps.size.outputs.size_mb }}
          IS_OVERSIZE: ${{ steps.size.outputs.is_oversize }}
          DID_PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          STATUS_TEXT="BUILT-ONLY"
          if [[ "$DID_PUSH" == "true" ]]; then
            STATUS_TEXT="PUSHED-GHCR"
          fi
          SIZE_BADGE="OK (< 250 MB)"
          if [[ "$IS_OVERSIZE" == "1" ]]; then
            SIZE_BADGE="WARNING (>= 250 MB)"
          fi

          {
            echo "## Docker Image Build Summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| **Image Tag** | \`${IMAGE_TAG}\` |"
            echo "| **Full OCI Ref** | \`${IMAGE_REF}\` |"
            echo "| **Platform** | \`linux/amd64\` |"
            echo "| **Image Size** | **${SIZE_MB} MB** (${SIZE_BADGE}) |"
            echo "| **Git Commit** | \`${SHORT_SHA}\` |"
            echo "| **Status** | \`${STATUS_TEXT}\` |"
            echo ""
            echo "### Ready-to-paste row for \`So_Quan_Ly_Docker_Image_QLGL.xlsx\`"
            echo '```text'
            echo "${BUILD_DATE} | ${IMAGE_TAG} | ${IMAGE_REF} | ${SIZE_MB} MB | ${SHORT_SHA} | GitHub Actions (linux/amd64) | ${STATUS_TEXT}"
            echo '```'
            echo ""
            echo "### Deploy on Azure VM (\`parish-infra-config\`)"
            echo '```bash'
            echo "./scripts/deploy.sh ${IMAGE_TAG}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
